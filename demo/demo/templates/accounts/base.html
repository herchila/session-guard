<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>{% block title %}{% endblock %} · Session Guard Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #0f0f0f;
            --foreground: #fafafa;
            --card: #1a1a1a;
            --border: #2d2d2d;
            --muted: #404040;
            --muted-foreground: #a6a6a6;
            --primary: #5c7dfa;
            --primary-hover: #4c6dd9;
            --primary-foreground: #fafafa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            line-height: 1.5;
            min-height: 100vh;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .header {
            width: 100%;
            max-width: 400px;
            margin-bottom: 48px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-badge {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background-color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 13px;
            color: var(--primary-foreground);
        }

        .logo-text h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--foreground);
            margin-bottom: 2px;
        }

        .logo-text p {
            font-size: 12px;
            color: var(--muted-foreground);
        }

        .form-wrapper {
            width: 100%;
            max-width: 400px;
        }

        .form-header {
            margin-bottom: 32px;
        }

        .form-header h2 {
            font-size: 32px;
            font-weight: 600;
            color: var(--foreground);
            margin-bottom: 8px;
        }

        .form-header p {
            font-size: 14px;
            color: var(--muted-foreground);
        }

        .form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--foreground);
        }

        .form-input {
            padding: 10px 12px;
            background-color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--foreground);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        .form-input::placeholder {
            color: var(--muted-foreground);
        }

        .form-input:focus {
            border-color: var(--primary);
            background-color: var(--background);
            box-shadow: 0 0 0 3px rgba(92, 125, 250, 0.1);
        }

        .submit-btn {
            width: 100%;
            height: 40px;
            margin-top: 24px;
            background-color: var(--primary);
            color: var(--primary-foreground);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .form-footer {
            font-size: 12px;
            color: var(--muted-foreground);
            text-align: center;
            margin-top: 24px;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% if user.is_authenticated %}
    <header>
        <div class="header-content">
            <div class="header-left">
                <div class="header-logo">SG</div>
                <div class="header-text">
                    <h1>Session Guard</h1>
                    <p>Device-aware sessions</p>
                </div>
            </div>

            <div class="header-right">
                <span class="header-username">@herchila</span>
                <button class="header-btn">Your sessions</button>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="header-btn">Logout</button>
                </form>
            </div>
        </div>
    </header>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
